; Set an option to 1 and restart the game to enable it.
[Developer]
; F9 developer tools and the F11 Free Cam shortcut.
developer_menu=0
; Diagnostic logs for troubleshooting.
logging=0
; Multiplayer development: log the player's state to preview-logs (needs logging=1).
; player_state_log_hz=1..30 sets the samples per second (default 5).
player_state_log=0
; Multiplayer M1 experiment: spawn a puppet that replays your controls a few seconds later.
; Optional: puppet_replay_delay_ms (default 3000), puppet_correct_cm (default 200),
; puppet_yaw_mode (0 none, 1 set yaw, 2 teleport every update; default 1),
; puppet_steer (1 steers toward your recorded position, 0 replays only; default 1).
puppet_replay=0
